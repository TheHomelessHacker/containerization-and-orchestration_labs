prometheus:
  prometheusSpec:
    retention: 2d
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    
    resources:
      requests:
        memory: 256Mi 
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    
    # размер PVC для метрик.
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi

grafana:
  adminPassword: "admin"
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  
  # TODO: отключить лишние дашборды? Пока оставь — пригодятся
  # adminPassword: "prom-operator"  # по умолчанию это
  service:
    type: ClusterIP  # доступ через port-forward
  # TODO: persistence — для лабы можно false (данные Grafana не критичны)
  persistence:
    enabled: false


alertmanager:
  alertmanagerSpec:
    # TODO: ресурсы (requests 64Mi/50m, limits 128Mi/100m)
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m

# === ОТКЛЮЧАЕМ НЕНУЖНЫЕ SCRAPE ===
# В kind нет доступа к etcd/kube-proxy/scheduler как к отдельным таргетам
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false