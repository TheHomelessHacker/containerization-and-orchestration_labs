apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-lab1
  labels:
    app: api-lab1
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-lab1
  template:
    metadata:
      labels:
        app: api-lab1
    spec:
      containers:
      - name: api-lab1
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        resources:
{{ toYaml .Values.resources | indent 10 }}
