apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: shop-api
    owner: student

# spec:
#   type: ClusterIP
#   selector:
#     app: shop-api
#   ports:
#   - port: 8080
#     targetPort: 8080

spec:
  type: {{ .Values.service.type }}
  selector:
    app: shop-api
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: 8080
    protocol: TCP