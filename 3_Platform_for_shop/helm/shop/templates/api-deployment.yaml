apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: shop-api
    owner: student
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: shop-api
  template:
    metadata:
      labels:
        app: shop-api
        owner: student
    spec:
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: IfNotPresent
        env:
        - name: HEALTH_FAIL
          value: "{{ .Values.api.env.HEALTH_FAIL }}"
        - name: DATABASE_URL
          value: "postgres://app:password@{{ .Release.Name }}-postgres-rw:5432/app?sslmode=disable"
        ports:
        - containerPort: 8080
        resources:
{{ toYaml .Values.api.resources | indent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10