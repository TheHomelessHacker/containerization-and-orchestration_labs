apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: shop-api
    owner: student
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: shop-api
  template:
    metadata:
      labels:
        app: shop-api
        owner: student
    spec:
      priorityClassName: shop-critical
      
      {{- if eq .Values.api.spreadMechanism "antiAffinity" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - shop-api
            topologyKey: "kubernetes.io/hostname"
      {{- else if eq .Values.api.spreadMechanism "topologySpread" }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "kubernetes.io/hostname"
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: shop-api
      {{- end }}

      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: IfNotPresent
        env:
        - name: HEALTH_FAIL
          value: "{{ .Values.api.env.HEALTH_FAIL }}"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-app
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-app
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-app
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-app
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-app
              key: dbname
        - name: DATABASE_URL
          value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
        ports:
        - containerPort: 8080
        resources:
{{ toYaml .Values.api.resources | indent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10