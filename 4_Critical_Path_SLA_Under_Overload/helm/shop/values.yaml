api:
  replicaCount: 4
  spreadMechanism: "topologySpread" 
  image:
    repository: shop-api
    tag: "1.0.0"
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  env:
    HEALTH_FAIL: "false"

worker:
  replicaCount: 2
  image:
    repository: shop-worker
    tag: "1.0.0"
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"

batch:
  replicaCount: 1
  image:
    repository: shop-batch
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  env:
    CPU_INTENSITY: "1000000"
    MEM_MB: "20"

service:
  type: ClusterIP
  port: 8080