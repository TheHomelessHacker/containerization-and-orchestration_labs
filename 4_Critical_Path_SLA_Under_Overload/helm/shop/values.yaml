api:
  replicaCount: 4
  spreadMechanism: "topologySpread" 
  image:
    repository: shop-api
    tag: "1.0.0"
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  env:
    HEALTH_FAIL: "false"

worker:
  replicaCount: 2
  image:
    repository: shop-worker
    tag: "1.0.0"
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"

service:
  type: ClusterIP
  port: 8080